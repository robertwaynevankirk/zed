[build]
rustflags = ["-C", "symbol-mangling-version=v0", "--cfg", "tokio_unstable"]

[alias]
xtask = "run --package xtask --"
perf-test = ["test", "--profile", "release-fast", "--lib", "--bins", "--tests", "--all-features", "--config", "target.'cfg(true)'.runner='cargo run -p perf --release'", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]"]
perf-compare = ["run", "--profile", "release-fast", "-p", "perf", "--config", "target.'cfg(true)'.rustflags=[\"--cfg\", \"perf_enabled\"]", "--", "compare"]

# Linux (Ubuntu z390a Compute Hub)
[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = [
    "-C", "link-arg=-fuse-ld=mold",
    "-C", "target-cpu=native",
    "-C", "llvm-args=-inline-threshold=500",
    "-C", "llvm-args=-unroll-threshold=500",
]

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
    "--cfg", "windows_slim_errors",
    "-C", "target-feature=+crt-static",
    "-C", "target-cpu=native",
    "-C", "link-arg=/threads:22",
    "-C", "link-arg=/OPT:REF,ICF",
    "-C", "link-arg=/pdbpagesize:8192",
    "-C", "llvm-args=-inline-threshold=500",
    "-C", "llvm-args=-unroll-threshold=500",
]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[env]
MACOSX_DEPLOYMENT_TARGET = "10.15.7"
